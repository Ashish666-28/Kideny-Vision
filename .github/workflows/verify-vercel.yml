name: Verify Vercel container

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build the Vercel image
        run: docker build -f Dockerfile.vercel -t kidney-vision-vercel .
      - name: Check backend routes and stateless sessions
        run: docker run --rm --entrypoint python kidney-vision-vercel check_flask_backend.py
      - name: Load the trained model checkpoint
        run: docker run --rm --entrypoint python kidney-vision-vercel model_predictor.py
